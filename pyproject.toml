[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zre"
version = "0.1.1"
description = "Pure Python ZRE (RFC 36) implementation for peer-to-peer discovery and messaging over ZeroMQ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Chukwudi Nwachukwu", email = "30695966+ichux@users.noreply.github.com"},
]
keywords = ["zeromq", "zre", "zyre", "rfc36", "p2p", "peer-to-peer", "discovery", "asyncio", "messaging", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Communications",
]
requires-python = ">=3.9"
dependencies = [
    "pyzmq>=25.0",
]

[project.urls]
Homepage = "https://github.com/pitch-cardinal-coding/zre"
Repository = "https://github.com/pitch-cardinal-coding/zre"
Issues = "https://github.com/pitch-cardinal-coding/zre/issues"
Changelog = "https://github.com/pitch-cardinal-coding/zre/blob/main/CHANGELOG.md"

[project.optional-dependencies]
secure = [
    "cryptography>=41.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zre*"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]
per-file-ignores = { "examples/*" = ["E402", "E741", "S101", "S603", "S607"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
